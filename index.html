<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Football Players">
  <meta name="theme-color" content="#1f2937">
  <meta name="description" content="Buscador de jugadores - Liga Profesional Argentina">
  
  <title>Players Pro - Liga Argentina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231f2937' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='%23fff' text-anchor='middle' dominant-baseline='middle'>⚽</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231f2937' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='%23fff' text-anchor='middle' dominant-baseline='middle'>⚽</text></svg>">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --secondary: #1f2937;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --light: #f3f4f6;
      --dark: #111827;
      --border: #d1d5db;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--secondary);
      color: #fff;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
      padding: 1rem 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: white;
      color: var(--primary);
      font-weight: 600;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    /* SEARCH & FILTERS */
    .search-container {
      max-width: 1200px;
      margin: 1rem auto;
      padding: 0 1rem;
      display: grid;
      gap: 1rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
    }

    .search-box input,
    .search-box select {
      flex: 1;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      background: var(--light);
      color: var(--secondary);
    }

    .search-box button {
      padding: 0.8rem 1.2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .search-box button:active {
      transform: scale(0.95);
      background: #2563eb;
    }

    .filter-chips {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--light);
      color: var(--secondary);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .chip:active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* CAMERA FOR FACE RECOGNITION */
    .camera-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto 1rem;
      padding: 0 1rem;
    }

    #video {
      width: 100%;
      border-radius: 12px;
      background: var(--dark);
      display: none;
    }

    .camera-controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .camera-controls button {
      flex: 1;
      min-width: 120px;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .btn-start-camera {
      background: var(--accent);
      color: white;
    }

    .btn-capture {
      background: var(--primary);
      color: white;
      display: none;
    }

    .btn-stop-camera {
      background: var(--danger);
      color: white;
      display: none;
    }

    /* RESULTS */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .player-card {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .player-card:active {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 8px 25px rgba(59,130,246,0.3);
    }

    .player-photo {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #4b5563;
      overflow: hidden;
      position: relative;
    }

    .player-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      padding: 0.8rem;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.3rem;
      color: white;
      word-break: break-word;
    }

    .player-number {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .player-details {
      font-size: 0.8rem;
      color: #9ca3af;
      line-height: 1.3;
    }

    .player-team {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 0.3rem;
    }

    .player-status {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      margin-top: 0.3rem;
      font-weight: 600;
    }

    .status-disponible {
      background: rgba(16,185,129,0.2);
      color: #10b981;
    }

    .status-lesionado {
      background: rgba(239,68,68,0.2);
      color: #ef4444;
    }

    /* MODAL DETALLES */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      padding: 1rem;
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
      align-items: flex-end;
    }

    .modal-content {
      background: var(--secondary);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 0;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
      padding: 1.5rem 1rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-photo {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .modal-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-detail-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .info-item {
      background: rgba(255,255,255,0.05);
      padding: 0.8rem;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }

    .info-label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .info-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
    }

    .btn-favorite {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .btn-favorite.is-favorite {
      background: var(--warning);
      color: white;
    }

    .btn-favorite:not(.is-favorite) {
      background: var(--light);
      color: var(--secondary);
    }

    /* LOADING & EMPTY STATES */
    .loading, .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #9ca3af;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid var(--light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* BOTTOM NAVBAR */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--secondary);
      border-top: 2px solid #374151;
      display: flex;
      justify-content: space-around;
      padding: 0.8rem 0;
      max-width: 100vw;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      font-size: 0.75rem;
      color: #6b7280;
      transition: color 0.3s ease;
      flex: 1;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.5rem;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .results-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }

      .header h1 {
        font-size: 1.2rem;
      }

      .search-box {
        flex-direction: column;
      }

      .player-details {
        font-size: 0.75rem;
      }
    }

    /* UTILIDADES */
    .hidden {
      display: none !important;
    }

    /* FACE DETECTION CANVAS */
    canvas {
      max-width: 100%;
      border-radius: 12px;
      margin: 1rem 0;
      background: var(--dark);
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <div class="header-content">
      <h1>⚽ Players Pro</h1>
      <div class="tabs">
        <button class="tab-btn active" data-tab="search">🔍 Buscar</button>
        <button class="tab-btn" data-tab="face">👤 Por Rostro</button>
        <button class="tab-btn" data-tab="favorites">⭐ Favoritos</button>
        <button class="tab-btn" data-tab="settings">⚙️ Ajustes</button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <!-- TAB: SEARCH -->
    <div id="search-tab" class="tab-content">
      <div class="search-container">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar jugador por nombre...">
          <button id="searchBtn">Buscar</button>
        </div>
        <div>
          <select id="teamFilter" class="search-box-full">
            <option value="">Todos los equipos</option>
          </select>
        </div>
        <div>
          <select id="positionFilter" class="search-box-full">
            <option value="">Todas las posiciones</option>
            <option value="Portero">Portero</option>
            <option value="Defensor">Defensor</option>
            <option value="Mediocampista">Mediocampista</option>
            <option value="Delantero">Delantero</option>
          </select>
        </div>
        <div class="filter-chips" id="statsFilters">
          <div class="chip" data-stat="topScorers">🎯 Goleadores</div>
          <div class="chip" data-stat="topAssists">👟 Asistentes</div>
          <div class="chip" data-stat="injured">🚑 Lesionados</div>
        </div>
      </div>
      <div id="results-container"></div>
    </div>

    <!-- TAB: FACE RECOGNITION -->
    <div id="face-tab" class="tab-content hidden">
      <div class="camera-container">
        <div id="loadingFaceAPI" class="loading">Cargando modelo de reconocimiento...</div>
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        <div class="camera-controls">
          <button class="btn-start-camera">📷 Activar Cámara</button>
          <button class="btn-capture">📸 Capturar Rostro</button>
          <button class="btn-stop-camera">❌ Detener</button>
        </div>
      </div>
      <div id="face-results" style="margin-top: 2rem;"></div>
    </div>

    <!-- TAB: FAVORITES -->
    <div id="favorites-tab" class="tab-content hidden">
      <div id="favorites-container"></div>
    </div>

    <!-- TAB: SETTINGS -->
    <div id="settings-tab" class="tab-content hidden">
      <div class="modal-body">
        <h2 style="margin-bottom: 1rem;">⚙️ Configuración</h2>
        <div class="info-item" style="margin-bottom: 1rem;">
          <div class="info-label">Base de Datos</div>
          <div class="info-value" id="dbStats">Cargando...</div>
        </div>
        <button id="updateDataBtn" style="width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 1rem;">
          🔄 Actualizar Datos
        </button>
        <button id="clearDataBtn" style="width: 100%; padding: 1rem; background: var(--danger); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
          🗑️ Limpiar Datos
        </button>
        <div style="margin-top: 2rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.85rem;">
          <p><strong>Versión:</strong> 1.0</p>
          <p style="margin-top: 0.5rem;">Esta app funciona completamente offline. Los datos se actualizan automáticamente.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DETALLES JUGADOR -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modalPlayerName"></h2>
          <p id="modalPlayerTeam" style="color: rgba(255,255,255,0.7); margin-top: 0.3rem;"></p>
        </div>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-photo">
          <img id="modalPlayerPhoto" src="" alt="">
          <span id="modalPhotoPlaceholder">👤</span>
        </div>
        <div class="player-detail-info" id="modalPlayerStats"></div>
        <button class="btn-favorite" id="favBtn">⭐ Agregar a Favoritos</button>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-item active" data-tab="search"><span class="nav-icon">🔍</span><span>Buscar</span></div>
    <div class="nav-item" data-tab="face"><span class="nav-icon">👤</span><span>Rostro</span></div>
    <div class="nav-item" data-tab="favorites"><span class="nav-icon">⭐</span><span>Favoritos</span></div>
    <div class="nav-item" data-tab="settings"><span class="nav-icon">⚙️</span><span>Ajustes</span></div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
