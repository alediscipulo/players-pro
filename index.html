<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plantel">
<meta name="theme-color" content="#12161C">
<title>Plantel &middot; Liga Profesional</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12161C; --ink-2:#3C444F; --ink-3:#79828E;
  --sheet:#E8E5DC; --sheet-2:#F4F2EC; --rule:#C8C3B6;
  --pitch:#1D5A3C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Archivo,system-ui,-apple-system,sans-serif;
  background:var(--sheet); color:var(--ink);
  font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto}

header{
  background:var(--ink); color:var(--sheet-2);
  padding:calc(env(safe-area-inset-top) + 18px) 18px 16px;
}
header h1{
  font-family:'Archivo Narrow',Archivo,sans-serif;
  font-weight:700; font-size:30px; letter-spacing:-.01em; line-height:1;
}
header p{color:#9BA4B0; font-size:13px; margin-top:6px}

.controls{
  position:sticky; top:0; z-index:20;
  background:var(--sheet); border-bottom:1px solid var(--rule);
  padding:12px 18px;
}
input[type=search]{
  width:100%; font:inherit; font-size:16px;
  padding:11px 13px; border:1.5px solid var(--ink);
  background:var(--sheet-2); color:var(--ink); border-radius:2px;
}
input[type=search]:focus{outline:2px solid var(--pitch);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.pos{margin-top:8px}
.chip{
  flex:0 0 auto; font:inherit; font-size:13px; font-weight:500;
  padding:6px 12px; border:1px solid var(--rule); background:transparent;
  color:var(--ink-2); border-radius:2px; cursor:pointer; white-space:nowrap;
}
.chip[aria-pressed=true]{background:var(--ink);color:var(--sheet-2);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.chip.pos-chip{border-color:var(--pitch);color:var(--pitch)}
.chip.pos-chip[aria-pressed=true]{background:var(--pitch);color:#fff;border-color:var(--pitch)}

.count{padding:10px 18px 0;font-size:13px;color:var(--ink-3)}

.viewtabs{display:flex;background:var(--ink);border-bottom:2px solid var(--pitch)}
.vtab{flex:1;font:inherit;font-size:13.5px;font-weight:600;padding:12px 8px;border:none;
  background:none;color:#9BA4B0;cursor:pointer;letter-spacing:.01em}
.vtab[aria-pressed=true]{color:#fff;box-shadow:inset 0 -3px 0 var(--pitch)}

.tabla-chips{padding:12px 18px 0;margin:0}
.tablatable{width:100%;border-collapse:collapse;font-size:12.5px}
.tablatable th{background:var(--ink);color:var(--sheet-2);font-weight:600;padding:7px 4px;
  text-align:center;position:sticky;top:0}
.tablatable th:nth-child(2){text-align:left}
.tablatable td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--rule);white-space:nowrap}
.tablatable td:nth-child(2){text-align:left;font-weight:600;white-space:normal}
.tablatable tr:nth-child(even){background:var(--sheet-2)}
.tablatable .tpos{color:var(--ink-3);font-weight:600}
.tablatable .tdg-pos{color:var(--pitch);font-weight:600}
.tablatable .tdg-neg{color:#B3122C;font-weight:600}
.tablewrap{overflow-x:auto;margin:10px 0 20px;border-top:2px solid var(--ink)}
.tabla-nota{padding-bottom:0}

.fav-section{margin:14px 18px 0;border:1.5px solid var(--ink);background:var(--sheet-2)}
.fav-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule)}
.fav-head b{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em}
.fav-head .fav-clear{margin-left:auto;font-size:12px;color:var(--ink-3);background:none;border:none;
  font:inherit;cursor:pointer;text-decoration:underline}
.fav-row{
  display:grid;grid-template-columns:1fr auto 30px;gap:10px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--rule);background:none;width:100%;
  text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.fav-row:last-child{border-bottom:none}
.fav-row .fnm{font-weight:600;font-size:14.5px}
.fav-row .feq{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.fav-row .fpos{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}

.star{border:none;background:none;font:inherit;font-size:19px;line-height:1;color:var(--ink-3);
  cursor:pointer;padding:4px;flex:0 0 auto}
.star.on{color:#B8862B}
.note-dot{color:var(--pitch);font-size:12px;margin-left:4px}

.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%);background:var(--ink);color:var(--sheet-2);
  padding:11px 14px;border-radius:3px;font-size:13.5px;display:flex;gap:14px;
  align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .15s ease;white-space:nowrap;
}
.toast.show{opacity:1;pointer-events:auto}
.toast button{font:inherit;font-weight:700;color:#F2C94C;background:none;border:none;cursor:pointer}

#totop{
  position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px);
  width:42px; height:42px; border-radius:50%; border:1.5px solid var(--ink);
  background:var(--ink); color:#fff; font-size:19px; line-height:1; cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.3); z-index:35;
  opacity:0; pointer-events:none; transform:translateY(8px);
  transition:opacity .18s ease, transform .18s ease;
}
#totop.show{opacity:1; pointer-events:auto; transform:translateY(0)}
#totop:active{transform:scale(.94)}

.club{margin-top:14px;border:1px solid var(--rule)}
.club-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px 10px 18px; border-top:2px solid var(--ink);
  background:var(--sheet-2); position:sticky; top:104px; z-index:10;
  cursor:pointer; list-style:none;
}
.club-bar::-webkit-details-marker{display:none}
.crest{width:14px;height:22px;flex:0 0 auto;border:1px solid rgba(0,0,0,.25)}
.club-bar h2{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:19px}
.club-bar .csub{font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right}
.club-bar .chev{flex:0 0 auto;font-size:13px;color:var(--ink-3);transition:transform .15s ease;margin-left:6px}
.club[open] .chev{transform:rotate(180deg)}

.pos-head{
  padding:14px 18px 4px; font-size:12px; font-weight:600;
  color:var(--pitch); letter-spacing:.02em;
}
ul{list-style:none}
li.row{
  display:grid; grid-template-columns:30px 1fr auto 34px; gap:10px; align-items:center;
  padding:9px 14px 9px 18px; border-bottom:1px solid var(--rule);
  cursor:pointer; background:none; width:100%; text-align:left; font:inherit; color:inherit;
}
li.row:focus-visible{outline:2px solid var(--pitch);outline-offset:-2px}
.num{
  font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:16px;
  line-height:1; text-align:right; color:var(--ink-3);
}
.num.none{font-size:12px;color:var(--ink-3);font-weight:600}
.nm{font-weight:700;font-size:16.5px;line-height:1.25}
.sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.meta{font-size:12.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.tag{font-weight:600;color:var(--pitch)}

dialog{
  border:none;padding:0;background:var(--sheet-2);color:var(--ink);
  width:min(440px,calc(100% - 28px));border-radius:3px;
  box-shadow:0 18px 50px rgba(18,22,28,.35);
}
dialog::backdrop{background:rgba(18,22,28,.55)}
.d-top{background:var(--ink);color:var(--sheet-2);padding:18px 20px;display:flex;gap:14px}
.d-num{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:46px;line-height:.9}
.d-top h3{font-size:20px;font-weight:600;line-height:1.2}
.d-top p{font-size:13px;color:#9BA4B0;margin-top:3px}
.d-body{padding:16px 20px 20px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule)}
.fact{background:var(--sheet-2);padding:9px 11px}
.fact dt{font-size:11.5px;color:var(--ink-3)}
.fact dd{font-size:17px;font-weight:600;margin-top:1px}
.d-close{display:block;width:100%;margin-top:14px;padding:11px;font:inherit;
  font-weight:600;background:var(--ink);color:var(--sheet-2);border:none;
  border-radius:2px;cursor:pointer}

.empty{padding:40px 18px;color:var(--ink-2);font-size:15px}
.empty b{display:block;font-size:16px;margin-bottom:5px;color:var(--ink)}
footer{padding:26px 18px 34px;font-size:12.5px;color:var(--ink-3);
  border-top:1px solid var(--rule);margin-top:26px}
footer a{color:var(--pitch)}
details{margin-top:9px}
summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details ul{margin-top:7px;columns:2;font-size:12px}
details li{padding:1px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Plantel</h1>
  <p>Liga Profesional Argentina &middot; datos de Promiedos, 6/9/2026</p>
</header>

<div class="viewtabs">
  <button class="vtab" data-view="plantel" aria-pressed="true">Planteles</button>
  <button class="vtab" data-view="tabla" aria-pressed="false">Tabla de posiciones</button>
</div>

<div id="plantelview">
<div class="controls">
  <input type="search" id="q" placeholder="Buscar por nombre, número o puesto" autocomplete="off">
  <div class="chips pos" id="poschips"></div>
  <div class="chips" id="chips"></div>
</div>

<p class="count" id="count"></p>
<div id="favbox"></div>
<div id="list"></div>
</div>

<div id="tablaview" style="display:none">
  <div class="chips tabla-chips" id="tablachips">
    <button class="chip" data-t="zonaA" aria-pressed="true">Zona A</button>
    <button class="chip" data-t="zonaB" aria-pressed="false">Zona B</button>
    <button class="chip" data-t="anual" aria-pressed="false">Tabla anual</button>
  </div>
  <p class="count" id="tabla-nota"></p>
  <div id="tablabox"></div>
</div>

<footer>
  Planteles tomados de <a href="https://www.promiedos.com.ar/league/liga-profesional/hc/equipos">promiedos.com.ar</a>.
  Edades y alturas según esa fuente al 2/9/2026. Goles, asistencias y tarjetas
  corresponden al Clausura y solo figuran para los jugadores que Promiedos lista
  entre los primeros de cada tabla.
  <details>
    <summary id="pend-t"></summary>
    <ul id="pend"></ul>
  </details>
</footer>
</div>

<dialog id="dlg">
  <div class="d-top">
    <div class="d-num" id="d-num"></div>
    <div style="flex:1"><h3 id="d-name"></h3><p id="d-sub"></p></div>
    <button class="star" id="d-star" aria-label="Marcar favorito" style="font-size:26px">☆</button>
  </div>
  <div class="d-body">
    <dl class="facts" id="d-facts"></dl>
    <label style="display:block;margin-top:14px;font-size:12px;color:var(--ink-3);font-weight:600">
      NOTAS PROPIAS &middot; se guardan en este teléfono
    </label>
    <textarea id="d-notes" rows="3" placeholder="Ej: viene de lesión, ex Estudiantes, debutó fecha anterior..."
      style="width:100%;margin-top:6px;font:inherit;font-size:14.5px;padding:9px 10px;
      border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px;resize:vertical"></textarea>
    <button class="d-close" id="d-close">Cerrar</button>
  </div>
</dialog>

<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo">Deshacer</button></div>
<button id="totop" aria-label="Volver arriba">&#8593;</button>

];

// ---- favoritos y notas: persisten en este teléfono (localStorage) ----
let favoritos = [];

try { favoritos = JSON.parse(localStorage.getItem('pl_favoritos') || '[]'); } catch (e) {}
try { notas = JSON.parse(localStorage.getItem('pl_notas') || '{}'); } catch (e) {}
const guardarFav = () => localStorage.setItem('pl_favoritos', JSON.stringify(favoritos));
const guardarNotas = () => localStorage.setItem('pl_notas', JSON.stringify(notas));

let toastTimer = null;
function mostrarToast(msg, onUndo) {
  clearTimeout(toastTimer);
  toastMsg.textContent = msg;
  toast.classList.add('show');
  toastUndo.onclick = () => { toast.classList.remove('show'); if (onUndo) onUndo(); };
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
}

function toggleFav(id, desdeUI) {
  const i = favoritos.indexOf(id);
  if (i > -1) {
    favoritos.splice(i, 1);
    guardarFav();
    const j = DATA.jugadores.find(x => x.id === id);
    mostrarToast(`Sacaste a ${j ? j.n : 'el jugador'} de destacados`, () => {
      favoritos.push(id); guardarFav(); render(); syncDialogStar(id);
    });
  } else {
    if (favoritos.length >= 8) {
      favoritos.shift();
    }
    favoritos.push(id);
    guardarFav();
  }
  render();
  if (desdeUI) syncDialogStar(id);
}

function vaciarFav() {
  if (!favoritos.length) return;
  const previos = [...favoritos];
  favoritos = [];
  guardarFav();
  render();
  mostrarToast('Vaciaste los destacados', () => { favoritos = previos; guardarFav(); render(); });
}

function syncDialogStar(id) {
  if (dlgAbiertoId === id) {
    const on = favoritos.includes(id);
    const s = document.getElementById('d-star');
    s.textContent = on ? '★' : '☆';
    s.classList.toggle('on', on);
  }
}

const chips = document.getElementById('chips');
chips.innerHTML = '<button class="chip" data-eq="" aria-pressed="true">Todos</button>' +
  DATA.equipos.map(e => `<button class="chip" data-eq="${e.id}" aria-pressed="false">${e.nombre}</button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filtroEq = b.dataset.eq || null;
  [...chips.children].forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});

const poschips = document.getElementById('poschips');
poschips.innerHTML = POSICIONES.map((p, i) =>
  `<button class="chip pos-chip" data-pos="${p.key}" aria-pressed="${i === 0}">${p.label}</button>`).join('');
poschips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filtroPos = b.dataset.pos || '';
  [...poschips.children].forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});

const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function filtrar() {
  const t = norm(q.value.trim());
  return DATA.jugadores.filter(j => {
    if (filtroEq && j.eqId !== filtroEq) return false;
    if (filtroPos && j.g !== filtroPos) return false;
    if (!t) return true;
    return norm(j.n).includes(t) || norm(j.pos).includes(t) ||
           norm(j.pais).includes(t) || j.num === t || norm(j.g).includes(t) ||
           (j.ant && norm(j.ant).includes(t));
  });
}

      <button class="fav-clear" id="fav-clear">vaciar</button></div>
    ${jugs.map(j => `<button class="fav-row" data-id="${j.id}">
      <span><span class="fnm">${j.n}${notas[j.id] ? '<span class="note-dot">✎</span>' : ''}</span>
      <div class="feq">${j.eq}</div></span>
      <span class="fpos">${j.pos}</span>
      <button class="star on" data-unfav="${j.id}" aria-label="Quitar de destacados">★</button>
    </button>`).join('')}
  </section>`;
}

function render() {
  const res = filtrar();
  count.textContent = res.length ? `${res.length} ${res.length === 1 ? 'persona' : 'personas'}` : '';
  renderFavoritos();

  if (!res.length) {
    list.innerHTML = `<div class="empty"><b>Sin resultados</b>
      Probá con el apellido, el número de camiseta o un puesto como “arquero”.</div>`;
    return;
  }

  let html = '';
  const abrirTodo = Boolean(q.value.trim()) || Boolean(filtroEq) || Boolean(filtroPos);
  for (const eq of DATA.equipos) {
    const delEq = res.filter(j => j.eqId === eq.id);
    if (!delEq.length) continue;
    html += `<details class="club"${abrirTodo ? ' open' : ''}><summary class="club-bar">
      <span class="crest" style="background:linear-gradient(90deg,${eq.c1} 50%,${eq.c2} 50%)"></span>
      <h2>${eq.nombre}</h2>
      <span class="csub">${delEq.length} ${delEq.length === 1 ? 'persona' : 'personas'}<br>${eq.estadio}</span>
      <span class="chev">&#9660;</span></summary>`;
    for (const g of ORDEN) {
      const grupo = delEq.filter(j => j.g === g);
      if (!grupo.length) continue;
      html += `<p class="pos-head">${g}</p><ul>`;
      for (const j of grupo) {
        const extra = [];
        if (j.goles) extra.push(`${j.goles} ${j.goles === 1 ? 'gol' : 'goles'}`);
        if (j.asis) extra.push(`${j.asis} asist.`);
        const isFav = favoritos.includes(j.id);
        html += `<li class="row" tabindex="0" role="button" data-id="${j.id}">
          <span class="num${j.num ? '' : ' none'}">${j.num || 's/n'}</span>
          <span><span class="nm">${j.n}${notas[j.id] ? '<span class="note-dot">✎</span>' : ''}</span><span class="sub">${j.pos}${
            extra.length ? ' &middot; <span class="tag">' + extra.join(' &middot; ') + '</span>' : ''
          }</span></span>
          <span class="meta">${j.edad} a&ntilde;os<br>${j.alt ? j.alt.toFixed(2) + ' m' : '&mdash;'}</span>
          <button class="star${isFav ? ' on' : ''}" data-fav="${j.id}" aria-label="Marcar destacado">${isFav ? '★' : '☆'}</button>
        </li>`;
      }
      html += '</ul>';
    }
    html += '</details>';
  }
  list.innerHTML = html;
}

let dlgAbiertoId = null;

function abrir(id) {
  const j = DATA.jugadores.find(x => x.id === id); if (!j) return;
  dlgAbiertoId = id;
  document.getElementById('d-num').textContent = j.num || 's/n';
  document.getElementById('d-name').textContent = j.n;
  document.getElementById('d-sub').textContent = `${j.eq} · ${j.pos}`;
  const f = [['Edad', j.edad + ' años'], ['Nacimiento', j.nac], ['Altura', j.alt ? j.alt.toFixed(2) + ' m' : '—'],
             ['País', j.pais], ['Goles', j.goles], ['Asistencias', j.asis],
             ['Amarillas', j.ta], ['Rojas', j.tr]];
  if (j.ant) f.push(['Viene de', j.ant]);
  document.getElementById('d-facts').innerHTML =
    f.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const s = document.getElementById('d-star');
  const on = favoritos.includes(id);
  s.textContent = on ? '★' : '☆';
  s.classList.toggle('on', on);
  document.getElementById('d-notes').value = notas[id] || '';
  dlg.showModal();
}

list.addEventListener('click', e => {
  const favBtn = e.target.closest('[data-fav]');
  if (favBtn) { e.stopPropagation(); toggleFav(+favBtn.dataset.fav); return; }
  const r = e.target.closest('.row'); if (r) abrir(+r.dataset.id);
});
list.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const r = e.target.closest('.row'); if (r) { e.preventDefault(); abrir(+r.dataset.id); }
});

favbox.addEventListener('click', e => {
  const unfav = e.target.closest('[data-unfav]');
  if (unfav) { e.stopPropagation(); toggleFav(+unfav.dataset.unfav); return; }
  if (e.target.id === 'fav-clear') { vaciarFav(); return; }
  const r = e.target.closest('.fav-row'); if (r) abrir(+r.dataset.id);
});

document.getElementById('d-star').addEventListener('click', () => {
  if (dlgAbiertoId != null) toggleFav(dlgAbiertoId, true);
});
document.getElementById('d-notes').addEventListener('input', e => {
  if (dlgAbiertoId == null) return;
  const val = e.target.value;
  if (val.trim()) notas[dlgAbiertoId] = val; else delete notas[dlgAbiertoId];
  guardarNotas();
});
document.getElementById('d-close').onclick = () => { dlg.close(); render(); };
dlg.addEventListener('close', () => { dlgAbiertoId = null; render(); });
q.addEventListener('input', render);

document.getElementById('pend-t').textContent =
  `Faltan ${DATA.pendientes.length} equipos — ver cuáles`;
document.getElementById('pend').innerHTML =
  DATA.pendientes.map(p => `<li><a href="${p.url}">${p.nombre}</a></li>`).join('');

// ---- vistas: planteles / tabla de posiciones ----
const vtabs = document.querySelectorAll('.vtab');
const plantelview = document.getElementById('plantelview');
const tablaview = document.getElementById('tablaview');
vtabs.forEach(b => b.addEventListener('click', () => {
  vtabs.forEach(x => x.setAttribute('aria-pressed', x === b));
  const v = b.dataset.view;

const tablachips = document.getElementById('tablachips');
const tablabox = document.getElementById('tablabox');
const tablaNota = document.getElementById('tabla-nota');

let liveAnual = null;       // tabla anual pisada por datos en vivo, si el fetch funciona
let liveTimestamp = null;

function renderTabla(clave) {
  const usarLive = clave === 'anual' && liveAnual;
  const filas = usarLive ? liveAnual : ((DATA.tablas && DATA.tablas[clave]) || []);
  const clubesPorNombre = Object.fromEntries(DATA.equipos.map(e => [e.nombre, e]));
  if (usarLive) {
    tablaNota.innerHTML = `🟢 en vivo · actualizado ${liveTimestamp}`;
  } else {
    tablaNota.textContent = DATA.tablas
      ? `${DATA.tablas.torneo} · última actualización manual: ${DATA.tablas.actualizado.split('-').reverse().join('/')}`
      : '';
  }
  if (!filas.length) { tablabox.innerHTML = '<div class="empty"><b>Sin datos</b></div>'; return; }
  tablabox.innerHTML = `<div class="tablewrap"><table class="tablatable">
    <thead><tr><th>#</th><th>Equipo</th><th>Pts</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th></tr></thead>
    <tbody>${filas.map(f => {
      const eq = clubesPorNombre[f.eq];
      const dgTxt = f.dg > 0 ? '+' + f.dg : String(f.dg);
      const dgClass = f.dg > 0 ? 'tdg-pos' : (f.dg < 0 ? 'tdg-neg' : '');
      return `<tr>
        <td class="tpos">${f.pos}</td>
        <td>${eq ? `<span class="crest" style="display:inline-block;vertical-align:middle;margin-right:6px;background:linear-gradient(90deg,${eq.c1} 50%,${eq.c2} 50%)"></span>` : ''}${f.eq}</td>
        <td><b>${f.pts}</b></td><td>${f.pj}</td><td>${f.pg}</td><td>${f.pe}</td><td>${f.pp}</td>
        <td>${f.gf}</td><td>${f.gc}</td><td class="${dgClass}">${dgTxt}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  <p class="count" style="padding:8px 4px 0">📰 <a href="https://www.elgrafico.com.ar/categoria/1110/mercado-de-pases" target="_blank" rel="noopener">Mercado de pases 2026 — informe completo (El Gráfico)</a></p>`;
}

// ---- intento de actualización en vivo de la tabla anual (mejor esfuerzo) ----
// Se apoya en una API pública no oficial (basada en ESPN). Si falla -- sin conexión,
// la API está caída, o cambia su formato -- la app se queda con la última tabla
// cargada manualmente (arriba), así que nunca se rompe ni queda en blanco.
const NOMBRE_ALIAS = {
  'boca juniors': 'Boca Juniors', 'boca': 'Boca Juniors',
  'river plate': 'River Plate',
  'racing club': 'Racing Club', 'racing': 'Racing Club',
  'argentinos juniors': 'Argentinos Juniors',
  'tigre': 'Tigre', 'club atletico tigre': 'Tigre',
  'gimnasia la plata': 'Gimnasia La Plata', 'gimnasia y esgrima la plata': 'Gimnasia La Plata',
  'independiente': 'Independiente',
  'san lorenzo': 'San Lorenzo', 'san lorenzo de almagro': 'San Lorenzo',
  'velez sarsfield': 'Vélez Sarsfield', 'velez sarsfield': 'Vélez Sarsfield',
  'estudiantes de la plata': 'Estudiantes LP', 'estudiantes lp': 'Estudiantes LP',
  'lanus': 'Lanús',
  'rosario central': 'Rosario Central',
  "newell's old boys": "Newell's Old Boys", 'newells old boys': "Newell's Old Boys",
  'huracan': 'Huracán',
  'talleres': 'Talleres de Córdoba', 'talleres de cordoba': 'Talleres de Córdoba',
  'belgrano': 'Belgrano',
  'banfield': 'Banfield',
  'platense': 'Platense',
  'defensa y justicia': 'Defensa y Justicia',
  'instituto': 'Instituto', 'instituto de cordoba': 'Instituto',
  'union santa fe': 'Unión de Santa Fe', 'union de santa fe': 'Unión de Santa Fe',
  'atletico tucuman': 'Atlético Tucumán',
  'central cordoba': 'Central Córdoba SdE', 'central cordoba sde': 'Central Córdoba SdE',
  'barracas central': 'Barracas Central',
  'deportivo riestra': 'Deportivo Riestra', 'riestra': 'Deportivo Riestra',
  'independiente rivadavia': 'Independiente Rivadavia',
  'gimnasia de mendoza': 'Gimnasia de Mendoza', 'gimnasia mendoza': 'Gimnasia de Mendoza',
  'estudiantes de rio cuarto': 'Estudiantes RC', 'estudiantes rio cuarto': 'Estudiantes RC',
  'sarmiento': 'Sarmiento Junín', 'sarmiento de junin': 'Sarmiento Junín',
  'aldosivi': 'Aldosivi',
};

async function fetchLiveTabla() {
  try {
    const res = await fetch('https://api-football-standings.azharimm.site/leagues/arg.1/standings?season=2026', { mode: 'cors' });
    if (!res.ok) return;
    const json = await res.json();
    const raw = json && json.data && json.data.standings;
    if (!Array.isArray(raw) || !raw.length) return;

    const val = (stats, ...keys) => {
      if (!Array.isArray(stats)) return null;
      for (const k of keys) {
        const hit = stats.find(s => (s.name || s.type || '').toLowerCase() === k);
        if (hit) return Number(hit.value ?? hit.displayValue);
      }
      return null;
    };

    const filas = [];
    for (const row of raw) {
      const teamName = row.team && (row.team.displayName || row.team.name || row.team.shortDisplayName);
      if (!teamName) continue;
      const key = teamName.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
      const nombre = NOMBRE_ALIAS[key];
      if (!nombre) continue; // equipo que no reconocemos: lo salteamos sin romper nada
      const stats = row.stats || [];
      const pts = val(stats, 'points', 'pts');
      const pj = val(stats, 'gamesplayed', 'played');
      const pg = val(stats, 'wins', 'w');
      const pe = val(stats, 'ties', 'draws', 'd');
      const pp = val(stats, 'losses', 'l');
      const gf = val(stats, 'pointsfor', 'goalsfor', 'gf');
      const gc = val(stats, 'pointsagainst', 'goalsagainst', 'ga');
      if ([pts, pj, pg, pe, pp].some(v => v === null || Number.isNaN(v))) continue;
      filas.push({
        eq: nombre, pts, pj, pg, pe, pp,
        gf: gf ?? 0, gc: gc ?? 0, dg: (gf ?? 0) - (gc ?? 0),
      });
    }
    if (filas.length < 20) return; // datos incompletos: no confiamos, seguimos con lo manual
    filas.sort((a, b) => b.pts - a.pts || b.dg - a.dg);
    filas.forEach((f, i) => f.pos = i + 1);
    liveAnual = filas;
    liveTimestamp = new Date().toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const activo = tablachips.querySelector('.chip[aria-pressed=true]');
    if (activo && activo.dataset.t === 'anual') renderTabla('anual');
  } catch (e) {
    // sin internet, API caída, CORS bloqueado, etc. -> queda la tabla manual, sin romper nada
  }
}
fetchLiveTabla();

tablachips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  [...tablachips.children].forEach(c => c.setAttribute('aria-pressed', c === b));
  renderTabla(b.dataset.t);
});
